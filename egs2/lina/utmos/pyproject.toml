[project]
name = "utmos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.16.0",
    "pydub>=0.25.1",
    "soundfile>=0.14.0",
    "tqdm>=4.70.1",
    "utmosv2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.uv.sources]
utmosv2 = { git = "https://github.com/sarulab-speech/UTMOSv2.git" }
